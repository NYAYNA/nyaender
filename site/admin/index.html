<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 · 냔냐의 엔더런</title><link rel="stylesheet" href="../style.css"><script src="admin.js" defer></script></head><body><main class="admin"><a class="back" href="../">← 위키로 돌아가기</a><div class="eyebrow">WIKI STUDIO</div><h1>위키 관리</h1><p class="lead">안내 문구와 아이템 설명을 수정하고 GitHub에 저장하세요.</p><p class="small">위키 안내만 수정합니다. 실제 마인크래프트 서버의 보상 설정은 변경되지 않습니다.</p>
<details class="connection"><summary>GitHub 연결 설정</summary><div class="grid"><div><label for="owner">계정</label><input id="owner" value="NYAYNA" autocomplete="off"></div><div><label for="repo">저장소</label><input id="repo" value="ender-run-wiki" autocomplete="off"></div></div><label for="branch">브랜치</label><input id="branch" value="main"><label for="token">관리자 GitHub 토큰</label><input id="token" type="password" autocomplete="off" placeholder="이 저장소의 Contents 쓰기 권한이 있는 토큰"><p class="small">토큰은 GitHub API로만 전송하며 브라우저 저장소나 파일에 저장하지 않습니다. 새로고침하면 다시 입력해야 합니다. SSAPI 키를 입력하지 마세요.</p><div class="actions"><button id="connect">연결하고 최신 내용 불러오기</button><button id="disconnect">연결 해제</button></div></details>
<p id="status" class="status" role="status" aria-live="polite"></p><div class="actions"><button id="save" disabled>GitHub에 저장</button><button id="download">JSON 내려받기</button><label for="import" style="margin:0">JSON 불러오기<input id="import" type="file" accept="application/json,.json"></label></div><p class="small">GitHub 저장은 권한이 있는 관리자만 가능합니다. 연결하지 않아도 내용을 편집하고 JSON 파일로 내려받을 수 있습니다.</p><div id="editor"></div></main></body></html>
